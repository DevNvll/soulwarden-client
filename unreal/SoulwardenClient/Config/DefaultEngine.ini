[SystemSettings]
; No Lumen gather of the back face for two-sided foliage (docs/MATERIALS.md, M_SwcFoliage): Unreal then adds
; SubsurfaceColor / pi to the diffuse color of the indirect light. Not proved retail parity: the source tiled deferred
; shader also has a back-face diffuse probe term for leaves (the diffuse probe at -N x the transmission;
; research/foliage-white-tops.md 3, AST-269); the value stays until a matched-view check. Above the scalability groups
; (GlobalIlluminationQuality 3 sets 1).
r.Lumen.ScreenProbeGather.TwoSidedFoliageBackfaceDiffuse=0
; The source fog (stage E5 step 3, docs/ENVIRONMENT.md): with the Lumen translucency volume, the Unreal volumetric fog takes its
; ambient from that volume with no gain (much brighter than the source term: the probe / 12.566). Without it, the fog uses the
; source ambient through the fog inscattering color. Translucent materials then use the sky light, not that volume.
r.Lumen.TranslucencyVolume.Enable=0
; The safe range of the cached pre-exposure of the lighting (stage E5, the contrast step, docs/ENVIRONMENT.md): the default 4
; gives [-8, 12] EV, and the day exposure of the client is about EV 12.5 (a red warning on the screen); 8 gives [-4, 16] and
; covers the source range EV 5 to 17. A technique value: it does not clamp the diffuse bounce.
r.EyeAdaptation.CachedLightingPreExposure=8
; The font atlases of the UI (AST-258): the game canvases use many fonts and sizes, and the large glyphs of the HUD went over the default
; limit of 1 texture ("Large atlases out of space; 2/1 Textures"): a flush of the font cache. More pages make a flush rare (the client
; shapes a line again after a flush: UI/SwcUiSlate.cpp).
Slate.MaxFontAtlasPagesBeforeFlush=4
Slate.MaxFontNonAtlasTexturesBeforeFlush=8

